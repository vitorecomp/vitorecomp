# Regenerates README.md with GitHub stats as native markdown, plus a
# self-rendered contribution-graph SVG (light/dark variants).
# Uses .github/scripts/update_readme.py against the GraphQL API. Public data
# only needs the default Actions token — no METRICS_TOKEN secret required.
name: Update README

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"
      - ".github/scripts/update_readme.py"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate README
        run: python3 .github/scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md contribution-graph.svg contribution-graph-dark.svg
          git diff --cached --quiet || {
            git commit -m "docs: update README metrics - [Skip GitHub Action]"
            git push
          }
